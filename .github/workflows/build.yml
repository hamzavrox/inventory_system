name: Build FloriManager

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  # ✅ Windows Build
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Rebuild native modules
        run: npm run postinstall

      - name: Build Windows
        run: npm run dist:win

      - uses: actions/upload-artifact@v4
        with:
          name: FloriManager-Windows
          path: release/*.exe

  # ✅ Mac Universal Build (Intel + ARM)
  build-mac:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Rebuild native modules
        run: npm run postinstall

      - name: Build Mac Universal
        run: npm run dist:mac

      - uses: actions/upload-artifact@v4
        with:
          name: FloriManager-Mac-Universal
          path: release/*.dmg

  # ✅ Linux Build
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Rebuild native modules
        run: npm run postinstall

      - name: Build Linux
        run: npm run dist:linux

      - uses: actions/upload-artifact@v4
        with:
          name: FloriManager-Linux
          path: release/*.AppImage