name: Build FloriManager

on:
  push:
    tags:
      - 'v*'        # v1.0.0 tag push karne par build hoga
  workflow_dispatch: # Manual trigger bhi kar sakte ho

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run postinstall
      - run: npm run dist:win
      - uses: actions/upload-artifact@v4
        with:
          name: FloriManager-Windows
          path: release/*.exe

  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run postinstall
      - run: npm run dist:mac
      - uses: actions/upload-artifact@v4
        with:
          name: FloriManager-Mac
          path: release/*.dmg

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run postinstall
      - run: npm run dist:linux
      - uses: actions/upload-artifact@v4
        with:
          name: FloriManager-Linux
          path: release/*.AppImage
